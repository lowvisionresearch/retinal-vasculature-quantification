# ============================================================================
# Conda environment for:
# Retinal Vasculature Analysis using OCT and OCTA
#
# Usage:
#   conda env create -f environment.yml
#   conda activate sloctolyzer
# ============================================================================

name: sloctolyzer

channels:
  - conda-forge
  - defaults

dependencies:
  # --------------------------------------------------------------------------
  # Core
  # --------------------------------------------------------------------------
  - python=3.11
  - pip
  - tk

  # --------------------------------------------------------------------------
  # Python packages
  # --------------------------------------------------------------------------
  - pip:
      # ----------------------------------------------------------------------
      # PyTorch
      # ----------------------------------------------------------------------
      - --find-links https://download.pytorch.org/whl/torch_stable.html
      - torch==2.6.0
      - torchvision==0.21.0

      # ----------------------------------------------------------------------
      # SLOctolyzer
      # ----------------------------------------------------------------------
      - eyepy==0.12.2
      - segmentation-models-pytorch==0.3.3
      - timm==0.9.2
      - efficientnet-pytorch==0.7.1
      - pretrainedmodels==0.7.4

      # ----------------------------------------------------------------------
      # Image processing
      # ----------------------------------------------------------------------
      - imagecodecs==2023.9.18
      - oct-converter==0.6.2
      - opencv-python==4.11.0.86
      - openpyxl==3.1.5
      - pillow==12.1.1
      - pydicom==3.0.1
      - scikit-image==0.25.1
      - scikit-learn==1.6.1
      - scipy==1.17.1
      - SimpleITK==2.4.1

      # ----------------------------------------------------------------------
      # Scientific computing
      # ----------------------------------------------------------------------
      - matplotlib==3.10.0
      - numpy==1.26.4
      - pandas==1.5.3
      - seaborn==0.13.2
      - tqdm==4.67.1

      # ----------------------------------------------------------------------
      # Jupyter (optional but recommended)
      # ----------------------------------------------------------------------
      - ipykernel==7.2.0
      - ipywidgets==8.1.5
      - jupyterlab==4.3.5
      - notebook==7.3.2

      # ----------------------------------------------------------------------
      # Utilities
      # ----------------------------------------------------------------------
      - natsort==8.4.0

      # Installation hook for SHA-256 verified model downloads on activation.
      # Run `conda env create -f environment.yml` from the repository root.
      - .
